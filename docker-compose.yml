x-app: &app
  build: .
  env_file: .env
  environment:
    # dentro da rede do Docker o Postgres responde em "db", não localhost
    DATABASE_URL: postgresql+psycopg://licensing:licensing@db:5432/licensing
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: licensing
      POSTGRES_PASSWORD: licensing
      POSTGRES_DB: licensing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licensing -d licensing"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    command: /app/.venv/bin/alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
