[project]
name = "licensing-api"
version = "0.1.0"
description = "API de licenciamento de software com chaves assinadas (Ed25519) e ativacao online"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pynacl>=1.5",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "slowapi>=0.1.9",
    "email-validator>=2.2",
    "typer>=0.27.0",
    "rich>=15.0.0",
]

[project.scripts]
licensing-cli = "cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]
